<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Waddle &amp; Slide</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1b3b55;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-controls {
      position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 12px; right: 12px;
      display: flex; gap: 8px; pointer-events: none; z-index: 2;
    }
    #game-controls button {
      pointer-events: auto; touch-action: manipulation; min-height: 44px; padding: 0 14px;
      border: 1px solid rgba(255,255,255,.55); border-radius: 12px;
      background: rgba(13,39,59,.88); color: #fff; font: 600 13px system-ui;
      cursor: pointer;
    }
    #game-controls button:focus-visible { outline: 3px solid #ffdf78; }
    #jump-button { margin-left: auto; min-width: 76px; }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="Waddle and Slide game"></canvas>
  <div id="game-controls" aria-label="Game controls">
    <button id="pause-button" type="button" aria-label="Pause game">Pause</button>
    <button id="mute-button" type="button" aria-label="Toggle sound" aria-pressed="false">Sound on</button>
    <button id="jump-button" type="button" aria-label="Jump">Jump</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
